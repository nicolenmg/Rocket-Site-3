<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rocket Launch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="scene-overlay" aria-hidden="true"></div>

  <div class="sky">
    <div class="rocket" role="img" aria-label="Rocket">
      <!-- Use emoji rocket for crisp scaling across sizes -->
      <div class="rocket-emoji" aria-hidden="false">🚀</div>
    </div>

    <div class="asteroid" aria-hidden="true"></div>
  </div>

  <div class="welcome" aria-hidden="true">Welcome Explorers</div>
  <div class="subwelcome" aria-hidden="true">To Outer Space</div>
  <div class="tap-screen" aria-hidden="true">Let's Go!</div>
  <div class="flash-overlay" aria-hidden="true"></div>
  <script src="script.js" defer></script>
</body>
</html>
